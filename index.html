<style>
/* 레이아웃: 상단 바 + 서랍 메뉴 + 한 열 작업 영역(최대 860px). 색은 3Dho LAB 로고(흰 바탕·검은 글자·파란 LAB) 기준 */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --sunk:#eef1f5; --ink:#111418; --muted:#555d68; --line:#dfe3e8;
  --accent:#1f66d1; --accent-ink:#ffffff; --accent-soft:#e8f0fc; --brand:#111418;
  --omr:#111418; --omr-ink:#ffffff; --omr-soft:#eef1f5;
  --good:#1d7a49; --good-soft:#e1f3e8; --warn:#94600e; --warn-soft:#faefdc; --bad:#b4332d; --bad-soft:#fce6e4;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0e11; --surface:#15181d; --sunk:#1c2026; --ink:#eef1f4; --muted:#a6aeb8; --line:#2b3038;
  --accent:#6ea6ff; --accent-ink:#0a1322; --accent-soft:#16253d; --brand:#eef1f4;
  --omr:#eef1f4; --omr-ink:#0c0e11; --omr-soft:#1c2026;
  --good:#6fd39b; --good-soft:#12301f; --warn:#f0bd62; --warn-soft:#33270f; --bad:#ff8a82; --bad-soft:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e11; --surface:#15181d; --sunk:#1c2026; --ink:#eef1f4; --muted:#a6aeb8; --line:#2b3038;
  --accent:#6ea6ff; --accent-ink:#0a1322; --accent-soft:#16253d; --brand:#eef1f4;
  --omr:#eef1f4; --omr-ink:#0c0e11; --omr-soft:#1c2026;
  --good:#6fd39b; --good-soft:#12301f; --warn:#f0bd62; --warn-soft:#33270f; --bad:#ff8a82; --bad-soft:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;letter-spacing:-.01em}
.brand .dday{font-family:var(--f-num);font-weight:600;color:var(--accent)}
.brand .sync{margin-left:auto;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
nav.tabs a{flex:none;padding:8px 12px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;font-size:14px}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding-top:20px}main>*{min-width:0}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-num);font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.02em}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;min-height:40px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.omr{background:var(--omr);border-color:var(--omr);color:var(--omr-ink)}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
select,input[type=number],input[type=date]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:40px}
label.chk{display:flex;gap:8px;align-items:center}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.q{font-size:16px;font-weight:500;white-space:pre-wrap}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font-weight:500;padding:10px 12px;min-height:44px}
.opt .no{font-family:var(--f-num);color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ng{border-color:var(--bad);background:var(--bad-soft)}
.explain{border-left:3px solid var(--accent);padding:8px 12px;background:var(--sunk);border-radius:0 8px 8px 0;font-size:14px}
.explain ol{margin:4px 0;padding-left:20px}
.keys{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.card{min-height:200px;display:grid;align-content:center;gap:12px;text-align:center;padding:24px;border:1px dashed var(--line);border-radius:var(--r);background:var(--sunk)}
.card .front{font-size:18px;font-weight:600;text-wrap:balance}
.card .back{font-size:16px;color:var(--ink);border-top:1px solid var(--line);padding-top:12px}
.tag{font-size:12px;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{display:grid;gap:0;line-height:1.3}
.rate small{font-weight:400;font-size:12px;color:var(--muted)}
.omrbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4;background:var(--omr-soft);border:1px solid var(--omr);border-radius:var(--r);padding:8px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.omrbar .timer{font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--accent)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.sheet button{min-height:32px;padding:2px;font-family:var(--f-num);font-size:12px;font-weight:500;border-color:color-mix(in srgb,var(--omr) 45%,var(--line));background:var(--surface)}
.sheet button.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sheet button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.sheet button.cur{outline:2px solid var(--ink)}
.subjhead{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.03em}
.confirm{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.logo{display:inline-flex;align-items:center;gap:8px;color:var(--brand)}.logo .wm{font-family:"Space Grotesk",var(--f-body);font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1}.logo .wm i{font-style:normal}.logo b{font-family:"Space Grotesk",var(--f-body);font-size:10px;font-weight:700;letter-spacing:.32em;padding:3px 3px 3px 7px;border:1.5px solid var(--accent);border-radius:4px;color:var(--accent);line-height:1}
.menubtn{border:0;background:transparent;padding:6px;min-height:40px;display:grid;place-items:center;color:var(--ink)}
.brand{align-items:center;padding-bottom:10px}
.brand .dday{margin-left:auto}
.drawer{position:fixed;inset:0;z-index:30;display:flex}
.drawer[hidden]{display:none!important}
.drawer .pane{width:min(300px,84vw);height:100%;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:grid;align-content:start;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.drawer .scrim{flex:1;background:color-mix(in srgb,#000 45%,transparent)}
.drawer nav{display:grid;gap:2px;margin-top:6px}
.drawer nav a{padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.drawer nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;text-decoration:none;color:inherit;min-height:84px;min-width:0}
.tile b{display:block;font-size:15px}
.tile span{font-size:12px;color:var(--muted)}
.tile svg{flex:none;color:var(--accent)}
.tile.wide{grid-column:1/-1}
.today3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today3 b{font-family:var(--f-num);font-size:30px;line-height:1.1;color:var(--accent)}
.timerrow{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.timerrow .clock{font-family:var(--f-num);font-size:22px;font-weight:600}
.timerrow button{margin-left:auto;border-radius:999px;width:48px;height:48px;padding:0;display:grid;place-items:center}
.ringcard{display:flex;gap:12px;align-items:center}
.ringcard .grow{flex:1;min-width:0}
a.link{color:var(--accent);font-weight:600;text-decoration:none}
.easy{background:var(--accent-soft);border-radius:10px;padding:12px 14px;line-height:1.7;font-weight:500;color:var(--ink)}
.easy .lbl{display:block;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em;margin-bottom:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:34px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px;padding:4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px color-mix(in srgb,#000 18%,transparent)}
.pill.dark{background:var(--omr);color:var(--omr-ink)}
.plantable td{vertical-align:middle}
.plantable tr.today td{background:var(--accent-soft)}
.plantable tr.done td:not(:last-child){color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.plantable input{width:20px;height:20px;accent-color:var(--accent)}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.confirm span{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.panel,.panel *{overflow-wrap:break-word;word-break:keep-all}
.pill{max-width:100%;white-space:normal}
.choice button:disabled{opacity:.45}.choice button.over{text-decoration:line-through}
.choice button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.guide ol{margin:0;padding-left:20px;display:grid;gap:10px}
.guide li b{display:block}
.oxq{display:grid;gap:16px;margin-top:4px}
.oxstmt{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:16px 18px;background:var(--sunk);font-size:16px;line-height:1.8;font-weight:500}
.oxstmt .lbl{display:block;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;margin-bottom:8px}
.oxhint{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.oxbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.steps ol{margin:0;padding-left:22px;display:grid;gap:8px;line-height:1.7}
.oxbtns .opt > span{display:grid;justify-items:center}
.oxsub{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.oxbtns .opt{justify-content:center;align-items:center;min-height:68px;font-size:26px;font-weight:700}
.opts{gap:12px}
.opt{padding:13px 14px;line-height:1.55}
.panel .q{line-height:1.7}
svg text{fill:var(--muted);font-family:var(--f-num);font-size:12px}
@media (prefers-reduced-motion:no-preference){.opt,.sheet button{transition:background .12s,border-color .12s}}

</style>

<script>
const CARDS = [["1-01","TAX","국세와 지방세의 대표 세목은?","국세: 소득세·법인세·상속세·증여세·부가가치세 / 지방세: 취득세·재산세·지방소득세 등",""],
["1-02","TAX","이자·배당소득 원천징수세율은?","14% (지방소득세 1.4% 별도 → 합계 15.4%)","숫자암기"],
["1-03","TAX","금융소득종합과세 기준금액은?","이자+배당 합계 연 2,000만원 초과 시 초과분을 다른 종합소득과 합산","숫자암기"],
["1-04","TAX","종합과세 대상일 때 세액 계산의 '비교과세'란?","종합과세 방식 세액과 분리과세(14%) 가정 세액 중 큰 금액을 산출세액으로 하는 방식",""],
["1-05","TAX","배당소득 Gross-up의 목적과 현행 가산율은?","법인세 이중과세 조정. 2024년 귀속분부터 10% (이전 11%)","숫자암기 개정확인"],
["1-06","TAX","비영업대금 이익(개인 간 대여 이자)의 원천징수세율은?","25% (온라인투자연계금융 등 예외 있음)","숫자암기"],
["1-07","TAX","상속세·증여세 신고기한은?","상속: 상속개시일이 속한 달 말일부터 6개월(국외 거주 9개월) / 증여: 증여일이 속한 달 말일부터 3개월","숫자암기"],
["1-08","TAX","증여재산공제(10년 합산) 주요 한도는?","배우자 6억, 직계존속→성년 자녀 5천만(미성년 2천만), 혼인·출산 증여공제 1억 추가","숫자암기 개정확인"],
["1-09","TAX","상속·증여세 세율 구조는?","10~50% 5단계 초과누진 (1억·5억·10억·30억 구간)","숫자암기 개정확인"],
["1-10","TAX","금융투자소득세는 현재 어떤 상태인가?","2024년 말 폐지 확정 → 상장주식 양도는 대주주 과세 등 기존 체계 유지","개정확인"],
["1-11","TAX","국세 부과제척기간 일반 원칙은?","일반 5년, 부정행위 10년, 상속·증여세 10년(부정 등 15년)","숫자암기"],
["1-12","TAX","세무전략에서 '소득 분산'의 예는?","가족 간 증여로 금융소득을 나눠 종합과세 기준(2천만원) 이하로 관리, 분리과세 상품 활용",""],

<script>
/* 계산 문제 생성기: 숫자를 매번 새로 뽑아 정답·오답 보기·풀이를 만든다 */
let RNG = Math.random;
const R = {
  int: (a, b) => a + Math.floor(RNG() * (b - a + 1)),
  step: (a, b, s) => { const n = Math.round((b - a) / s); return +(a + s * Math.floor(RNG() * (n + 1))).toFixed(6); },
  pick: a => a[Math.floor(RNG() * a.length)],
};
const fmt = (x, d = 2) => (Math.round(x * 10 ** d) / 10 ** d).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pc = (x, d = 2) => fmt(x * 100, d) + '%';

const GENS = [
  { id: 'bondPrice', sub: 'BND', name: '채권 가격', make() {
    const n = R.pick([2, 3]), c = R.int(2, 6) / 100; let y; do { y = R.int(3, 7) / 100; } while (y === c);
    const F = 10000, cp = F * c; let P = 0, rows = [];
    for (let t = 1; t <= n; t++) { const cf = cp + (t === n ? F : 0), df = 1 / (1 + y) ** t; P += cf * df; rows.push(`t=${t}: CF ${fmt(cf, 0)} × 할인계수 ${fmt(df, 4)} = ${fmt(cf * df, 2)}`); }
    const noLast = P - cp / (1 + y) ** n, simple = cp * n + F / (1 + y) ** n;
    let atC = 0; for (let t = 1; t <= n; t++) atC += (cp + (t === n ? F : 0)) / (1 + c) ** t;
    return { q: `액면 10,000원, 표면이율 연 ${pc(c, 0)}(연 1회 이자 후급), 만기 ${n}년 채권의 만기수익률이 ${pc(y, 0)}일 때 채권 가격은? (원 미만 반올림)`,
      ans: P, d: 0, unit: '원', wrong: [noLast, simple, atC],
      steps: ['현금흐름: 매년 이자 ' + fmt(cp, 0) + '원, 만기에 액면 10,000원 추가', ...rows, '가격 = 현재가치 합계 = ' + fmt(P, 0) + '원', y > c ? '수익률 > 표면이율 → 할인 발행(액면 미만)' : '수익률 < 표면이율 → 할증(액면 초과)'],
      keys: `1 ÷ ${1 + y} = (할인계수 1년), 이어서 ÷ ${1 + y} = 를 반복하며 각 CF와 곱해 M+` };
  } },
  { id: 'macDur', sub: 'BND', name: '맥컬리 듀레이션', make() {
    const n = R.pick([2, 3]), c = R.int(3, 8) / 100, y = R.int(3, 8) / 100, F = 10000, cp = F * c;
    let P = 0, W = 0, rows = [];
    for (let t = 1; t <= n; t++) { const cf = cp + (t === n ? F : 0), pv = cf / (1 + y) ** t; P += pv; W += t * pv; rows.push(`t=${t}: PV ${fmt(pv, 2)}, t×PV ${fmt(t * pv, 2)}`); }
    const D = W / P;
    return { q: `액면 10,000원, 표면이율 ${pc(c, 0)}(연 1회), 만기 ${n}년, 만기수익률 ${pc(y, 0)}인 채권의 맥컬리 듀레이션은? (년)`,
      ans: D, d: 2, unit: '년', wrong: [D / (1 + y), n, D * (1 + y)],
      steps: [...rows, `가격 P = ${fmt(P, 2)}`, `D = Σ(t×PV) ÷ P = ${fmt(W, 2)} ÷ ${fmt(P, 2)} = ${fmt(D, 2)}년`, '함정: 수정듀레이션(D÷(1+y))과 혼동하지 않기'],
      keys: 'PV는 M+로 누적(MR=가격), t×PV는 GT 또는 종이에 합산' };
  } },
  { id: 'priceChg', sub: 'BND', name: '수정듀레이션 가격변화', make() {
    const D = R.step(2, 8, 0.1), y = R.int(3, 7) / 100, dy = R.pick([0.005, 0.01, -0.005, -0.01]);
    const MD = D / (1 + y), ch = -MD * dy;
    return { q: `맥컬리 듀레이션 ${fmt(D, 1)}년, 만기수익률 ${pc(y, 0)}(연 1회 복리)인 채권의 수익률이 ${dy > 0 ? '+' : ''}${fmt(dy * 100, 1)}%p 변할 때 가격변화율은? (볼록성 무시)`,
      ans: ch * 100, d: 2, unit: '%', wrong: [-D * dy * 100, MD * dy * 100, -MD * dy * 1000],
      steps: [`수정듀레이션 MD = D ÷ (1+y) = ${fmt(D, 1)} ÷ ${1 + y} = ${fmt(MD, 3)}`, `ΔP/P ≈ −MD × Δy = −${fmt(MD, 3)} × ${dy} = ${fmt(ch * 100, 2)}%`, '부호 확인: 수익률↑ → 가격↓'],
      keys: `${D} ÷ ${1 + y} = × ${Math.abs(dy)} = 후 부호와 %(×100) 처리` };
  } },
  { id: 'cb', sub: 'BND', name: '전환사채 괴리율', make() {
    const K = R.pick([8000, 10000, 12500]), S = R.step(K * 0.8, K * 1.4, 100), pv = S / K * 10000, CB = Math.round(pv * R.step(1.02, 1.2, 0.01) / 10) * 10;
    const g = (CB - pv) / pv;
    return { q: `전환가격 ${fmt(K, 0)}원, 현재 주가 ${fmt(S, 0)}원, 전환사채(액면 10,000원) 시장가격 ${fmt(CB, 0)}원일 때 괴리율은?`,
      ans: g * 100, d: 2, unit: '%', wrong: [(CB - pv) / CB * 100, (CB - 10000) / 10000 * 100, (S / K * 100 - 100)],
      steps: [`패리티 = 주가 ÷ 전환가격 × 100 = ${fmt(S / K * 100, 2)}`, `패리티가격 = 패리티 × 액면/100 = ${fmt(pv, 0)}원`, `괴리율 = (CB가격 − 패리티가격) ÷ 패리티가격 = ${fmt(g * 100, 2)}%`],
      keys: `${S} ÷ ${K} × 10000 = M+ , ${CB} − MR = ÷ MR =` };
  } },
  { id: 'futures', sub: 'DRV', name: '지수선물 이론가격', make() {
    const S = R.step(300, 400, 0.5), r = R.step(0.025, 0.045, 0.005), d = R.step(0.01, 0.025, 0.005), days = R.pick([30, 60, 90, 120]);
    const F = S * (1 + (r - d) * days / 365);
    return { q: `KOSPI200 현물지수 ${fmt(S, 2)}, CD금리 연 ${pc(r, 1)}, 배당수익률 연 ${pc(d, 1)}, 잔존 ${days}일일 때 선물 이론가격은?`,
      ans: F, d: 2, unit: 'pt', wrong: [S * (1 + r * days / 365), S * (1 + (r + d) * days / 365), S * (1 + (r - d))],
      steps: [`F = S × [1 + (r − d) × t/365]`, `= ${S} × [1 + (${r} − ${d}) × ${days}/365]`, `= ${S} × ${fmt(1 + (r - d) * days / 365, 5)} = ${fmt(F, 2)}`],
      keys: `${r} − ${d} = × ${days} ÷ 365 + 1 = × ${S} =` };
  } },
  { id: 'hedgeN', sub: 'DRV', name: '헤지 선물 계약수', make() {
    const P = R.pick([50, 80, 100, 150, 200]), b = R.step(0.8, 1.5, 0.1), F = R.int(320, 400), m = 250000;
    const N = b * P * 1e8 / (F * m);
    return { q: `주식포트폴리오 ${P}억원(베타 ${fmt(b, 1)})을 KOSPI200 선물(가격 ${F}pt, 거래승수 25만원)로 완전 헤지하려면 필요한 계약 수는? (반올림)`,
      ans: Math.round(N), d: 0, unit: '계약', wrong: [Math.round(P * 1e8 / (F * m)), Math.round(P * 1e8 / (b * F * m)), Math.round(N * 2)],
      steps: [`1계약 금액 = ${F} × 250,000 = ${fmt(F * m, 0)}원`, `N = β × P ÷ (F × 승수) = ${fmt(b, 1)} × ${P}억 ÷ ${fmt(F * m, 0)} = ${fmt(N, 2)} → ${Math.round(N)}계약 매도`],
      keys: `${F} × 250000 = M+ , ${P}00000000 × ${b} ÷ MR =` };
  } },
  { id: 'pcp', sub: 'DRV', name: '풋-콜 패리티', make() {
    const S = R.int(92, 108), K = 100, r = R.pick([0.03, 0.04, 0.05]), C = R.step(3, 12, 0.5);
    const P = C + K / (1 + r) - S;
    if (P <= 0.3) return this.make();
    return { q: `기초자산 ${S}, 행사가격 ${K}, 만기 1년, 무위험이자율 ${pc(r, 0)}(이산복리), 유럽형 콜 가격 ${fmt(C, 1)}일 때 풋 가격은?`,
      ans: P, d: 2, unit: '', wrong: [C + K - S, C - K / (1 + r) + S, C + K * (1 + r) - S],
      steps: ['C + K/(1+r)^T = P + S → P = C + K/(1+r) − S', `K/(1+r) = ${K} ÷ ${1 + r} = ${fmt(K / (1 + r), 2)}`, `P = ${fmt(C, 1)} + ${fmt(K / (1 + r), 2)} − ${S} = ${fmt(P, 2)}`],
      keys: `${K} ÷ ${1 + r} = + ${C} − ${S} =` };
  } },
  { id: 'breakeven', sub: 'DRV', name: '옵션 손익분기점', make() {
    const call = RNG() < 0.5, K = R.step(250, 400, 2.5), p = R.step(1, 8, 0.5);
    const be = call ? K + p : K - p;
    return { q: `행사가격 ${fmt(K, 1)}인 ${call ? '콜' : '풋'}옵션을 프리미엄 ${fmt(p, 1)}에 매수했다. 만기 손익분기 기초자산 가격은?`,
      ans: be, d: 1, unit: '', wrong: [call ? K - p : K + p, K, call ? K + 2 * p : K - 2 * p],
      steps: [call ? '콜 매수 손익분기 = 행사가격 + 프리미엄' : '풋 매수 손익분기 = 행사가격 − 프리미엄', `= ${fmt(be, 1)}`],
      keys: call ? `${K} + ${p} =` : `${K} − ${p} =` };
  } },
  { id: 'hRatio', sub: 'DRV', name: '최소분산 헤지비율', make() {
    const rho = R.pick([0.8, 0.85, 0.9, 0.95]), sS = R.step(0.015, 0.03, 0.001), sF = R.step(0.015, 0.03, 0.001);
    const h = rho * sS / sF;
    return { q: `현물 수익률 표준편차 ${pc(sS, 1)}, 선물 수익률 표준편차 ${pc(sF, 1)}, 상관계수 ${rho}일 때 최소분산 헤지비율은?`,
      ans: h, d: 2, unit: '', wrong: [sS / sF, rho * sF / sS, rho],
      steps: [`h = ρ × σS ÷ σF = ${rho} × ${fmt(sS * 100, 1)} ÷ ${fmt(sF * 100, 1)} = ${fmt(h, 2)}`],

  { id: 'fisher', sub: 'MAC', name: '피셔 방정식', make() {
    const i = R.step(0.02, 0.06, 0.005), p = R.step(0.01, 0.04, 0.005);
    return { q: `명목금리 ${pc(i, 1)}, 기대인플레이션 ${pc(p, 1)}일 때 피셔 방정식에 의한 실질금리(근사)는?`,
      ans: (i - p) * 100, d: 2, unit: '%', wrong: [(i + p) * 100, (p - i) * 100, i * p * 1000],
      steps: [`명목금리 ≈ 실질금리 + 기대인플레이션 → 실질 ≈ ${pc(i, 1)} − ${pc(p, 1)} = ${fmt((i - p) * 100, 2)}%`],
      keys: `${i} − ${p} =` };
  } },
];

/* 생성 결과를 4지선다 문제로 바꾼다 */
function buildCalc(gen) {
  const g = gen.make();
  const f = x => fmt(x, g.d) + (g.unit ? ' ' + g.unit : '');
  const right = f(g.ans); const opts = [right];
  for (const w of g.wrong) { const s = f(w); if (isFinite(w) && !opts.includes(s)) opts.push(s); if (opts.length === 4) break; }
  const muls = [1.08, 0.92, 1.15, 0.85, 1.25, 0.75, 1.4, 0.6];
  for (const m of muls) { if (opts.length === 4) break; const base = g.ans === 0 ? 1 : g.ans; const s = f(base * m); if (!opts.includes(s)) opts.push(s); }
  const order = opts.map((o, i) => [RNG(), i]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  return { id: 'c:' + gen.id, sub: gen.sub, gen: gen.id, calc: true, q: g.q, opts: order.map(i => opts[i]), a: order.indexOf(0), steps: g.steps, keys: g.keys, exp: '' };
}

  const hist = el('section', 'panel'); hist.innerHTML = '<h3>모의고사 기록</h3>';
  const rows = Object.entries(S.mocks).filter(([, m]) => m.done).map(([k, m]) => [m.at, k + '회(앱)', m.score]).concat(S.ext.map(e => [e.d, '외부', e])).sort((a, b) => a[0].localeCompare(b[0]));
  hist.insertAdjacentHTML('beforeend', rows.length ? `<div class="tablewrap"><table><thead><tr><th>날짜</th><th>구분</th><th class="r">1과목</th><th class="r">2과목</th><th class="r">3과목</th><th class="r">합계</th><th>판정</th></tr></thead><tbody>${rows.map(([d, l, s]) => `<tr><td class="num">${esc(d)}</td><td>${esc(l)}</td>${s.s.map((x, i) => `<td class="r num" style="${x < SUBJ[i + 1][2] ? 'color:var(--bad)' : ''}">${x}</td>`).join('')}<td class="r num"><b>${s.t}</b></td><td>${s.pass ? '<span class="pill good">합격</span>' : '<span class="pill bad">불합격</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">기록 없음</p>');
  v.append(hist);
  const st = el('section', 'panel'); st.innerHTML = '<h3>설정</h3>';
  const d = el('div', 'row'); d.innerHTML = `<label class="small" for="ed">시험일</label><input id="ed" type="date" value="${esc(S.examDate)}"><span class="small muted">2027년 일정 공고 전까지 1/17은 추정입니다.</span>`;
  d.querySelector('input').onchange = e => { if (e.target.value) { S.examDate = e.target.value; persist(); render(); } };
  const u = el('label', 'chk'); u.innerHTML = `<input id="ua" type="checkbox" ${S.unlockAll ? 'checked' : ''}> 카드 전체 열기 (학습계획 날짜와 상관없이)`; u.querySelector('input').onchange = e => { S.unlockAll = e.target.checked; persist(); };
  const g = el('div', 'row'); g.innerHTML = `<label class="small" for="gl">하루 목표 문제 수</label><input id="gl" type="number" min="5" max="300" step="5" value="${S.goal}" style="width:90px">`;
  g.querySelector('input').onchange = e => { const n = +e.target.value; if (n >= 5) { S.goal = n; persist(); } };
  const th = el('div', 'row'); th.innerHTML = '<span class="small">화면 테마</span>' + themeSeg(); th.lastChild.style.flex = '1'; th.lastChild.style.maxWidth = '320px';
  const ez = el('label', 'chk'); ez.innerHTML = `<input id="ez" type="checkbox" ${S.easy !== false ? 'checked' : ''}> 입문 모드: 계산 문제에 쉬운 말 공식을 처음부터 보이기 (끄면 '힌트 보기' 버튼으로 바뀜)`; ez.querySelector('input').onchange = e => { S.easy = e.target.checked; persist(); };
  st.append(d, g, u, ez, th);
  st.insertAdjacentHTML('beforeend', `<p class="small muted" style="margin:0">저장 위치: ${mode === 'db' ? 'claude.ai 계정 (휴대폰·PC에서 같은 기록)' : '이 브라우저만 (claude.ai에 로그인한 상태로 열면 계정에 저장됩니다)'}</p><p class="small muted" style="margin:0">문제은행 ${BANKQ.length}문항 · 계산 유형 ${GENS.length}종 · 개념 카드 ${CARDS.length}장 · OX ${OXQ.length}문항. 모든 문항은 표준교재 범위를 직접 요약해 만든 것이며 기출 원문이 아닙니다. 세법·법규 수치는 최신 교재로 확인하세요.</p>`);
  if (mode !== 'db') {
    const bk = el('div', 'row');
    bk.append(btn('백업 파일 저장', '', () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = '3Dho_LAB_백업_' + today() + '.json'; document.body.append(a); a.click(); a.remove(); } catch (e) { } }));
    const inp = el('input'); inp.type = 'file'; inp.accept = 'application/json,.json'; inp.id = 'restore'; inp.hidden = true;
    inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (o && o.v === 1) { S = Object.assign(blank(), o); persist(); render(); } } catch (e) { setSync('백업 파일을 읽지 못했습니다'); } }; r.readAsText(f); };
    bk.append(btn('백업 불러오기', '', () => inp.click()), inp);
    st.append(bk);
    st.insertAdjacentHTML('beforeend', '<p class="small muted" style="margin:0">이 기기에만 저장됩니다. 휴대폰을 바꾸거나 사파리 데이터를 지우면 기록이 사라지니 가끔 백업 파일을 저장해 두세요. 다른 기기로 옮길 때도 백업 파일을 불러오면 됩니다.</p>');
  }
  const rs = btn('모든 기록 초기화', 'ghost', () => confirmBox(st, '모든 풀이·카드·모의고사 기록을 지웁니다. 되돌릴 수 없습니다.', () => { const keep = S.examDate; S = blank(); S.examDate = keep; persist(); render(); }));
  st.append(rs); v.append(st);
}

/* ===== 시작 ===== */
applyTheme();
render();
connect();

</script>

</body></html>
